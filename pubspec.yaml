name: riexport_ue
description: Sistema de Gestión de Exportaciones de Café hacia la Unión Europea.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter # Traduce calendarios, selectores y controles Material al español.

  supabase_flutter: ^2.17.2
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  flutter_dotenv: ^6.0.1
  file_picker: ^13.3.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  http: ^1.6.0 # Simula las respuestas de Supabase en las pruebas del perfil.

flutter:
  uses-material-design: true

  assets:
    - .env
